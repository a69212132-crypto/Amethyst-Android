name: Android CI

on:
  pull_request:
    branches:
      - 'v3_openjdk'
      - 'main'
      - 'master'
    types: [ opened, reopened, synchronize ]
  push:
    branches:
      - 'v3_openjdk'
      - 'main'
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Get JRE17
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav

      - name: Get JRE21
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-pojav

      - name: Get JRE25
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-25
          workflow_conclusion: completed
          repo: FCL-Team/Android-OpenJDK-Build
          branch: Build_JRE_25
          name: jre25-multiarch

      - name: Validate JRE artifacts
        run: |
          set -e
          echo "Validating JRE downloads..."
          [ -d "app_pojavlauncher/src/main/assets/components/jre" ] || (echo "JRE 8 not found" && exit 1)
          [ -d "app_pojavlauncher/src/main/assets/components/jre-new" ] || (echo "JRE 17 not found" && exit 1)
          [ -d "app_pojavlauncher/src/main/assets/components/jre-21" ] || (echo "JRE 21 not found" && exit 1)
          [ -d "app_pojavlauncher/src/main/assets/components/jre-25" ] || (echo "JRE 25 not found" && exit 1)
          echo "✓ All JRE artifacts validated"

      - uses: gradle/actions/setup-gradle@v4
        with:
           validate-wrappers: true
           gradle-version: "8.11"
           cache-cleanup: on-success

      - name: Verify Gradle installation
        run: gradle --version

      - name: Run scripts
        run: |
          set -e
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug .apk
        run: |
          set -e
          echo "Building launcher..."
          gradle :app_pojavlauncher:assembleDebug
          [ -f "app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk" ] || (echo "APK build failed" && exit 1)
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk
          echo "✓ Debug APK built successfully"

      - name: Gen md5sums
        run: |
          set -e
          md5sum out/app-debug.apk > out/app-debug.md5
          cat out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*
          
